<div class="example-container">
    <mat-toolbar class="example-toolbar">
        <button mat-icon-button (click)="sidenav.toggle()">
            @if (!sidenav.opened) {
                <mat-icon>menu</mat-icon>
            }@else {
                <mat-icon>close</mat-icon>
            }
        </button>

        <span>BIBLAPP</span>

        <span class="example-spacer"></span>

        <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
            <button mat-menu-item>
                <mat-icon>account_box</mat-icon>
                <span>My account</span>
            </button>
            <button mat-menu-item (click)="logout()">
                <mat-icon>exit_to_app</mat-icon>
                <span>Logout</span>
            </button>
        </mat-menu>
    </mat-toolbar>

    <mat-sidenav-container class="example-sidenav-container">
        <mat-sidenav #sidenav style="width: 250px" mode="side">

            <img src="biblioteca_logo.png" width="128" style="margin-left: 20px">

            <mat-divider></mat-divider>


                <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                   routerLink="/pages/search">
                    <mat-icon>search</mat-icon>
                    <span>Busqueda</span>
                </button>
                <mat-divider></mat-divider>
                 <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                   routerLink="/pages/categoria">
                    <mat-icon>Category</mat-icon>
                    <span>Categoria</span>
                </button>
                <mat-divider></mat-divider>
                 <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                   routerLink="/pages/cliente">
                    <mat-icon>person</mat-icon>
                    <span>Cliente</span>
                </button>
                <mat-divider></mat-divider>
                 <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                   routerLink="/pages/libro">
                    <mat-icon>menu_book</mat-icon>
                    <span>Libros</span>
                </button>
                <mat-divider></mat-divider>
                 <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                   routerLink="/pages/reserva">
                    <mat-icon>book_online</mat-icon>
                    <span>Reservas</span>
                </button>

        </mat-sidenav>

        <mat-sidenav-content>
            <router-outlet></router-outlet>
        </mat-sidenav-content>

    </mat-sidenav-container>

</div>
