<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background / Book Base -->
  <rect x="20" y="20" width="260" height="360" rx="12" fill="url(#bookCoverGrad)" filter="url(#shadow)" />
  
  <!-- Spine Shadow Overlay -->
  <rect x="20" y="20" width="28" height="360" rx="12" fill="url(#spineGrad)" />
  <line x1="48" y1="20" x2="48" y2="380" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Center Decorative Frame -->
  <rect x="68" y="70" width="164" height="240" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="4 4" stroke-width="2" />

  <!-- Book Icon -->
  <g transform="translate(118, 140)" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
    <path d="M6 6h10" />
    <path d="M6 10h8" />
  </g>

  <!-- Text -->
  <text x="150" y="240" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1">
    SIN PORTADA
  </text>
  <text x="150" y="265" fill="#93c5fd" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    BiblApp
  </text>
</svg>
